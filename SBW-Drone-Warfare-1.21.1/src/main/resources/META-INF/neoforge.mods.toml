modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}
Code: GNU AGPL version 3 (LICENSE). Visual assets: LICENSE-ASSETS.md. External notices: THIRD-PARTY-NOTICES.md. Rights review: RIGHTS-REVIEW.md.'''
logoFile="cacc.png"

[[mixins]]
config="sbwdroneconfig.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="superbwarfare"
type="required"
versionRange="${sbw_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="optional"
versionRange="[4.7.5,)"
ordering="AFTER"
side="CLIENT"
